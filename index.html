<style>
/* Layout idea: an engineer's notebook. Grid paper, blue pen for anything you act on,
   one yellow highlighter for "today", pencil grey for the rest. In the dark it becomes a blueprint. */
:root {
  --paper: #F2F4F9;
  --grid: rgba(35, 64, 217, .06);
  --surface: #FFFFFF;
  --surface-2: #EBEEF6;
  --ink: #141E3A;
  --pencil: #58627E;
  --line: #D3D9E8;
  --pen: #2340D9;
  --pen-ink: #FFFFFF;
  --pen-soft: #E4E9FD;
  --marker: #FFE04A;
  --marker-wash: #FFE04A;
  --good: #14794F;
  --good-soft: #DDF3E8;
  --warn: #9A5F00;
  --warn-soft: #FCEFD2;
  --crit: #C2302A;
  --crit-soft: #FBE3E1;
  --hue-s: 68%;
  --hue-l: 42%;
  --hue-soft-l: 93%;
  --shadow: 0 1px 2px rgba(20, 30, 58, .06), 0 8px 24px -12px rgba(20, 30, 58, .18);
  --font-display: 'Karantina', 'IBM Plex Sans Hebrew', 'Arial Hebrew', Arial, sans-serif;
  --font-body: 'IBM Plex Sans Hebrew', 'Heebo', 'Arial Hebrew', 'Segoe UI', Arial, sans-serif;
  --font-num: 'IBM Plex Sans Hebrew', 'Heebo', 'Arial Hebrew', 'Segoe UI', Arial, sans-serif;
  --r: 14px;
  --r-s: 9px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1430; --grid: rgba(147, 167, 255, .075); --surface: #141E42; --surface-2: #1C2852;
    --ink: #E9EDFB; --pencil: #A0ACCC; --line: #2B3866; --pen: #98ABFF; --pen-ink: #0C1430; --pen-soft: #212E62;
    --marker: #F4D548; --marker-wash: rgba(244, 213, 72, .34);
    --good: #62D6A0; --good-soft: #143B30; --warn: #F2BC62; --warn-soft: #3D3018; --crit: #FF8F87; --crit-soft: #47201F;
    --hue-s: 78%; --hue-l: 72%; --hue-soft-l: 22%;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1430; --grid: rgba(147, 167, 255, .075); --surface: #141E42; --surface-2: #1C2852;
  --ink: #E9EDFB; --pencil: #A0ACCC; --line: #2B3866; --pen: #98ABFF; --pen-ink: #0C1430; --pen-soft: #212E62;
  --marker: #F4D548; --marker-wash: rgba(244, 213, 72, .34);
  --good: #62D6A0; --good-soft: #143B30; --warn: #F2BC62; --warn-soft: #3D3018; --crit: #FF8F87; --crit-soft: #47201F;
  --hue-s: 78%; --hue-l: 72%; --hue-soft-l: 22%;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: start; }
a { color: var(--pen); text-decoration: none; }
b, strong { font-weight: 600; }
small { font-size: 12.5px; color: var(--pencil); }
:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ================= frame ================= */
.app { height: 100%; display: grid; grid-template-columns: 232px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.rail { display: flex; flex-direction: column; gap: 22px; padding: 26px 16px 18px; background: var(--surface); border-inline-end: 1px solid var(--line); overflow-y: auto; }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar, .tabbar, .fab { display: none; }
.view {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 30px 34px 56px;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; background-attachment: local;
}
.view:focus { outline: none; }
.view-in { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.view-in.v-week { max-width: 1560px; }

.brand { display: flex; flex-direction: column; align-items: flex-start; font-family: var(--font-display); font-weight: 700; line-height: .86; color: var(--ink); padding: 0 8px; letter-spacing: .01em; }
.brand-a { font-size: 34px; font-weight: 400; color: var(--pencil); }
.brand-b { font-size: 58px; }
.brand.small { flex-direction: row; gap: 7px; align-items: baseline; padding: 0; }
.brand.small .brand-a { font-size: 25px; }
.brand.small .brand-b { font-size: 31px; }
.mark { background: linear-gradient(transparent 56%, var(--marker-wash) 56%, var(--marker-wash) 92%, transparent 92%); padding: 0 .08em; margin: 0 -.08em; }

.rail-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--r-s); color: var(--pencil); font-weight: 500; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.on { background: var(--pen-soft); color: var(--pen); font-weight: 600; }
.nav-item .ic { width: 20px; height: 20px; }
.badge { margin-inline-start: auto; min-width: 22px; padding: 0 6px; height: 22px; display: inline-grid; place-items: center; border-radius: 11px; background: var(--pen); color: var(--pen-ink); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }

.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--pencil); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.sync.busy i { background: var(--pen); animation: pulse 1s ease-in-out infinite; }
.sync.bad i { background: var(--crit); } .sync.bad { color: var(--crit); }
.sync.warn i, .sync.local i { background: var(--warn); }
.sync.wait i { background: var(--line); }
@keyframes pulse { 50% { opacity: .3; } }

.banners { display: flex; flex-direction: column; }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 34px; background: var(--pen-soft); color: var(--ink); font-size: 14px; border-bottom: 1px solid var(--line); }
.banner > span { flex: 1; min-width: 200px; }
.banner.warn { background: var(--warn-soft); } .banner.bad { background: var(--crit-soft); }
.banner .ic { color: var(--pencil); }

/* ================= building blocks ================= */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { padding: 12px 14px; }
details.card > summary { cursor: pointer; font-weight: 500; color: var(--pencil); }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.wrap { flex-wrap: wrap; } .row.between { justify-content: space-between; } .row.center { justify-content: center; }
.pad-s { padding: 8px 0; border-top: 1px solid var(--line); }
.grow { flex: 1; min-width: 0; } .ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--pencil); font-size: 14px; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.link { font-size: 14px; font-weight: 500; white-space: nowrap; }
.link:hover { text-decoration: underline; }
.count { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--pencil); background: var(--surface-2); border-radius: 10px; padding: 1px 8px; margin-inline-start: 8px; font-variant-numeric: tabular-nums; vertical-align: middle; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: hsl(var(--h, 226) var(--hue-s) var(--hue-l)); display: inline-block; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 8px 16px; border-radius: var(--r-s); font-weight: 600; font-size: 15px; white-space: nowrap; border: 1.5px solid transparent; transition: background .12s, border-color .12s, transform .06s; }
.btn:active { transform: translateY(1px); }
.btn { max-width: 100%; }
.btn > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.btn.primary { background: var(--pen); color: var(--pen-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: var(--line); background: var(--surface); color: var(--ink); }
.btn.ghost:hover { border-color: var(--pen); color: var(--pen); }
.btn.danger { background: var(--crit); color: var(--surface); }
.btn.danger-ghost { color: var(--crit); }
.btn.danger-ghost:hover { background: var(--crit-soft); }
.btn.sm { min-height: 34px; padding: 4px 11px; font-size: 13.5px; border-radius: 8px; }
.btn.wide { width: 100%; }
.btn.ai { border-color: var(--marker); background: var(--surface); color: var(--ink); }
.btn.ai .ic { color: var(--warn); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 9px; color: var(--pencil); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.sm { width: 34px; height: 34px; }
.icon-btn.sm .ic { width: 16px; height: 16px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 1.3; color: var(--pencil); background: var(--surface-2); border-radius: 7px; padding: 2px 7px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.chip .ic { width: 13px; height: 13px; }
.chip .dot { width: 8px; height: 8px; }
.chip.area { background: hsl(var(--h, 226) var(--hue-s) var(--hue-soft-l)); color: var(--ink); }
.chip.late { background: var(--crit-soft); color: var(--crit); font-weight: 600; }
.chip.now { background: var(--marker-wash); color: var(--ink); font-weight: 600; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.streak { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip.from-chat { border: 1px dashed var(--line); background: none; }
.chip.match-high { background: var(--good-soft); color: var(--good); font-weight: 600; }
.chip.match-medium { background: var(--pen-soft); color: var(--pen); }
.chip.match-try { background: var(--surface-2); color: var(--pencil); }
.icon-btn.ext { color: var(--pen); margin-top: -4px; }

/* jobs from the agent's report */
.jobs { border-inline-start: 6px solid hsl(272 var(--hue-s) var(--hue-l)); }
.job-list { display: flex; flex-direction: column; }
.job { display: flex; flex-direction: column; gap: 6px; padding: 11px 0; border-top: 1px solid var(--line); }
.job:first-child { border-top: 0; padding-top: 2px; }
.job-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.job-title { font-weight: 600; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.job-top .chip { flex: none; max-width: none; }
.job-title:hover { color: var(--pen); }
.job-meta { font-size: 13.5px; color: var(--pencil); }
.job-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.ij-list { display: flex; flex-direction: column; }
.ij-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.ij-row:first-child { border-top: 0; }
.ij-row input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--pen); flex: none; }
.ij-main { display: flex; flex-direction: column; min-width: 0; }
.ij-main b { overflow-wrap: anywhere; }
.ij-row.dup .ij-main b { color: var(--pencil); }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.inline { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 10px; }
.field > label, .label { font-size: 13.5px; font-weight: 600; color: var(--pencil); display: inline-flex; align-items: center; gap: 6px; }
.hint { font-size: 13px; color: var(--pencil); }
.hint.warn { color: var(--warn); } .hint.up { margin-top: -6px; }
input[type="text"], input[type="search"], input[type="url"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-s);
  color: var(--ink); min-width: 0;
}
textarea { resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--pencil); opacity: .75; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--pen); box-shadow: 0 0 0 3px var(--pen-soft); }
input.bad { border-color: var(--crit); box-shadow: 0 0 0 3px var(--crit-soft); }
input[type="date"], input[type="url"] { direction: ltr; text-align: end; }
.check-line { display: inline-flex; align-items: center; gap: 9px; font-size: 15px; }
.check-line input { width: 20px; height: 20px; accent-color: var(--pen); }
.file-in { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.choice { display: flex; flex-wrap: wrap; gap: 7px; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 5px 12px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--surface); font-size: 14px; font-weight: 500; color: var(--ink); }
.pill:hover { border-color: var(--pen); }
.pill.on { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.pill.on .dot { box-shadow: 0 0 0 2px var(--pen-ink); }
.choice.tight .pill { min-height: 32px; padding: 3px 10px; font-size: 13px; }
.choice.seg { gap: 0; flex-wrap: nowrap; border: 1.5px solid var(--line); border-radius: var(--r-s); overflow: hidden; width: fit-content; max-width: 100%; }
.choice.seg .pill { border: 0; border-radius: 0; min-height: 40px; flex: 1; justify-content: center; border-inline-end: 1.5px solid var(--line); white-space: nowrap; }
.choice.seg .pill:last-child { border-inline-end: 0; }
.choice.seg.nums .pill { min-width: 38px; padding: 5px 4px; font-variant-numeric: tabular-nums; }
.choice.hues .pill { width: 36px; padding: 0; justify-content: center; }
.choice.hues .dot { width: 16px; height: 16px; }
.choice.hues .pill.on { background: var(--surface); border-color: var(--ink); }
.choice.hues .pill.on .dot { box-shadow: none; }

/* pen-stroke tick box */
.cb { width: 26px; height: 26px; flex: none; border: 2px solid var(--pencil); border-radius: 8px; display: inline-grid; place-items: center; background: var(--surface); transition: border-color .12s, background .12s; position: relative; }
.cb::after { content: ''; position: absolute; inset: -9px; }
.cb:hover { border-color: var(--pen); }
.cb svg { width: 20px; height: 20px; fill: none; stroke: var(--pen); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }

      if (actx.state === 'suspended') actx.resume();
    } catch (e) { /* no sound */ }
  }
  function beep() {
    try {
      if (!actx) return;
      const t0 = actx.currentTime;
      [0, 0.26, 0.52].forEach(function (d, i) {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = i === 2 ? 880 : 660;
        g.gain.setValueAtTime(0.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(0.18, t0 + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.22);
        o.connect(g); g.connect(actx.destination);
        o.start(t0 + d); o.stop(t0 + d + 0.24);
      });
    } catch (e) { /* no sound */ }
  }
  function log(s, min, atMs) {
    const entry = {};
    entry['s' + uid()] = { min: min, at: new Date(atMs).toISOString(), taskId: s.taskId || null, courseId: s.courseId || null, label: s.label || '' };
    Actions.setDay(ymd(new Date(atMs)), { s: entry });
  }
  function paint() {
    const ms = left();
    document.querySelectorAll('[data-timer-clock]').forEach(function (el) { el.textContent = fmtClock(ms); });
    document.querySelectorAll('[data-timer-ring]').forEach(function (el) {
      const total = st ? st.dur * 60000 : 1;
      el.style.setProperty('--p', String(Math.max(0, Math.min(1, 1 - ms / total))));
    });
  }
  function tick() {
    if (!st) { clearInterval(iv); iv = null; return; }
    if (st.pausedLeft == null && left() <= 0) { complete(); return; }
    paint();
  }
  function ensureTick() { if (!iv) iv = setInterval(tick, 500); }
  function complete() {
    const s = st; st = null; persist();
    log(s, s.dur, Math.min(s.end, Date.now()));
    beep();
    toast('סיימת ' + fmtMinutes(s.dur) + ' של מיקוד. זמן להפסקה קצרה.', { ms: 9000 });
    Store.notify();
  }
  return {
    boot: function () { load(); if (st) { if (st.pausedLeft == null && left() <= 0) complete(); else ensureTick(); } },
    state: function () { return st; },
    left: left,
    running: function () { return !!st && st.pausedLeft == null; },
    start: function (o) {
      st = { end: Date.now() + o.min * 60000, dur: o.min, taskId: o.taskId || null, courseId: o.courseId || null, label: o.label || '', pausedLeft: null };
      persist(); primeAudio(); ensureTick(); Store.notify();
    },
    pause: function () { if (!st || st.pausedLeft != null) return; st.pausedLeft = Math.max(0, st.end - Date.now()); persist(); Store.notify(); },
    resume: function () { if (!st || st.pausedLeft == null) return; st.end = Date.now() + st.pausedLeft; st.pausedLeft = null; persist(); primeAudio(); ensureTick(); Store.notify(); },
    stop: function () {
      if (!st) return;
      const s = st, min = Math.floor((s.dur * 60000 - left()) / 60000);
      st = null; persist();
      if (min >= 1) { log(s, min, Date.now()); toast('נרשמו ' + fmtMinutes(min) + ' של מיקוד'); }
      else toast('הטיימר נעצר, לא נרשם זמן');
      Store.notify();
    },
    paint: paint
  };
})();

const AI = {
  fn: null,
  init: async function () {
    try {
      const cl = window.claude;
      if (cl && typeof cl.use === 'function') { AI.fn = await cl.use('sample'); if (AI.fn) Store.notify(); }
    } catch (e) { AI.fn = null; }
  },
  available: function () { return typeof AI.fn === 'function'; },
  /** Turn a failure into words for the person; hides the feature when it can never work here. */
  explain: function (e) {
    const c = e && e.code;
    if (c === 'cancelled') return '';
    if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') {
      AI.fn = null; Store.notify();
      return 'Claude לא זמין בדף הזה.';
    }
    if (c === 'rate_limited') return 'יותר מדי בקשות, או שהמכסה שלך נגמרה. אפשר לנסות שוב מאוחר יותר.';
    if (c === 'session_expired') return 'צריך להתחבר מחדש ל-Claude ואז לנסות שוב.';
    if (c === 'refused') return 'Claude לא ענה על הבקשה הזאת. נסה לנסח את המשימה אחרת.';
    if (c === 'invalid_json' || c === 'empty_completion') return 'התשובה לא הגיעה בצורה שאפשר להשתמש בה. אפשר לנסות שוב.';
    return 'הבקשה ל-Claude נכשלה בדרך. אפשר לנסות שוב.';
  }
};

/** Only plain web links may become an href. */
function safeUrl(u) {
  u = String(u || '').trim();
  if (!/^https?:\/\/[^\s]+$/i.test(u)) return null;
  try { return new URL(u).href; } catch (e) { return null; }
}
const MATCH_LABEL = { high: 'התאמה גבוהה', medium: 'התאמה בינונית', try: 'שווה ניסיון' };
function matchChip(m) {
  if (!MATCH_LABEL[m]) return null;
  return h('span', { class: 'chip match-' + m }, MATCH_LABEL[m]);
}
function extLink(url, label, cls) {
  const u = safeUrl(url);
  if (!u) return null;
  return h('a', { class: cls || 'ext-link', href: u, target: '_blank', rel: 'noopener noreferrer', title: u, onclick: function (e) { e.stopPropagation(); } },
    icon('ext'), label ? h('span', null, label) : null);
}
function areaChip(areaId) {
  const a = areaById(areaId);
  if (!a) return null;
  return h('span', { class: 'chip area', style: { '--h': String(a.hue) } }, h('span', { class: 'dot' }), a.name);
}
function dueChip(t, today) {
  if (!t.due) return null;
  const cls = t.done ? '' : t.due < today ? ' late' : t.due === today ? ' now' : '';
  return h('span', { class: 'chip due' + cls }, icon('calendar'), fmtDue(t.due, today));
}
function metaChips(t, opts) {
  opts = opts || {};
  const today = todayStr(), out = [];
  if (!opts.hideDue) out.push(dueChip(t, today));
  if (!opts.hideArea) out.push(areaChip(t.area));
  if (opts.brief) {
    if (t.repeat) out.push(h('span', { class: 'chip', title: repeatLabel(t.repeat) }, icon('repeat')));
    return out.filter(Boolean);
  }
  if (t.repeat) out.push(h('span', { class: 'chip' }, icon('repeat'), repeatLabel(t.repeat)));
  if (t.est) out.push(h('span', { class: 'chip' }, icon('clock'), fmtMinutes(t.est)));
  const subs = t.subs || [];
  if (subs.length) out.push(h('span', { class: 'chip' }, icon('tasks'), subs.filter(function (s) { return s.done; }).length + '/' + subs.length));
  if (t.goalId) { const g = Store.get('goals', t.goalId); if (g) out.push(h('span', { class: 'chip' }, icon('goals'), g.title)); }
  if (t.courseId) { const c = Store.get('courses', t.courseId); if (c) out.push(h('span', { class: 'chip' }, icon('study'), c.name)); }
  if (t.src === 'chat') out.push(h('span', { class: 'chip from-chat', title: 'נוסף מתוך השיחות שלך עם Claude' }, 'מהשיחות'));
  if (t.src === 'jobs') { out.push(h('span', { class: 'chip from-chat', title: 'נוסף מדוח סוכן המשרות' }, 'מהסוכן')); out.push(matchChip(t.match)); }
  return out.filter(Boolean);
}

function taskRow(t, opts) {
  opts = opts || {};
  const today = todayStr();
  const late = !t.done && t.due && t.due < today;
  const row = h('div', { class: 'task' + (t.done ? ' done' : '') + (late ? ' late' : '') + (t.prio ? ' p' + t.prio : ''), dataset: { id: t.id } },
    checkbox(!!t.done, function (on, el) { el.classList.toggle('on', on); row.classList.toggle('done', on); Actions.toggleTask(t.id); }, (t.done ? 'בטל סימון: ' : 'סמן כבוצע: ') + t.title),
    h('button', { type: 'button', class: 'task-main', onclick: function () { Sheets.task(t.id); }, 'aria-label': 'ערוך: ' + t.title },
      h('span', { class: 'task-title' },
        t.prio ? h('span', { class: 'prio', title: t.prio === 2 ? 'דחוף' : 'חשוב' }, t.prio === 2 ? '!!' : '!') : null,
        h('span', { class: 'tt' }, t.title)),
      (function () { const chips = metaChips(t, opts); return chips.length ? h('span', { class: 'task-meta' }, chips) : null; })()
    ),
    t.url ? extLink(t.url, null, 'icon-btn sm ext') : null,

  if (opts.draggable) {

    row.addEventListener('dragend', function () { row.classList.remove('dragging'); });

/** One-line task entry that understands "מחר", "#בית", "!", "30 דק", "כל שבוע". */
function quickAdd(opts) {
  opts = opts || {};
  const skip = {};
  const defaults = opts.defaults || {};
  const input = h('input', {
    id: opts.id, class: 'qa-input', type: 'text', autocomplete: 'off', enterkeyhint: 'done',
    placeholder: opts.placeholder || 'משימה חדשה…', 'aria-label': 'משימה חדשה'

  const parse = function () { return parseQuick(input.value, { today: todayStr(), areas: settings().areas, skip: skip }); };

        type: 'button', class: 'qa-chip', title: 'לחץ כדי לא לפרש את זה', style: hue != null ? { '--h': String(hue) } : null,

    };

    if (r.est) put(chips, mk('est', fmtMinutes(r.est), 'clock'));
  };
  const submit = function () {

    if (defaults.goalId) f.goalId = defaults.goalId;

    input.value = '';

    paint();
    if (opts.onAdded) opts.onAdded(id);
    App.renderNow();
  };
  input.addEventListener('input', paint);
  return h('form', { class: 'qa' + (opts.cls ? ' ' + opts.cls : ''), onsubmit: function (e) { e.preventDefault(); submit(); } },
    h('div', { class: 'qa-row' }, icon('plus', 'qa-plus'), input, h('button', { type: 'submit', class: 'btn primary sm' }, 'הוסף')),
    chips, opts.noHint ? null : hint);
}

function dayRing(S, today, now) {
  const months = Store.map('months');
  const startMin = S.dayStart * 60, endMin = Math.max(startMin + 60, S.dayEnd * 60), span = endMin - startMin;
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const p = Math.max(0, Math.min(1, (nowMin - startMin) / span));
  const R = 52, C = 2 * Math.PI * R;
  let center, label;
  if (nowMin < startMin) { center = pad2(S.dayStart) + ':00'; label = 'היום מתחיל'; }
  else if (nowMin >= endMin) { center = '0:00'; label = 'היום הסתיים'; }
  else { const leftMin = endMin - nowMin; center = Math.floor(leftMin / 60) + ':' + pad2(leftMin % 60); label = 'נשארו היום'; }

  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 120 120');
  svg.setAttribute('class', 'ring-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', label + ' ' + center + ' שעות, מתוך יום של ' + pad2(S.dayStart) + ':00 עד ' + pad2(S.dayEnd) + ':00');
  let inner = '<circle class="ring-track" cx="60" cy="60" r="' + R + '"/>';
  // hour ticks
  const hours = Math.round(span / 60);
  for (let i = 0; i <= hours; i++) {
    const a = (i / hours) * 2 * Math.PI - Math.PI / 2;
    const major = (S.dayStart + i) % 3 === 0;
    const r1 = R - (major ? 9 : 7), r2 = R - 5;
    if (i === hours) continue;
    inner += '<line class="ring-tick' + (major ? ' major' : '') + '" x1="' + (60 + r1 * Math.cos(a)).toFixed(2) + '" y1="' + (60 + r1 * Math.sin(a)).toFixed(2) + '" x2="' + (60 + r2 * Math.cos(a)).toFixed(2) + '" y2="' + (60 + r2 * Math.sin(a)).toFixed(2) + '"/>';
  }
  if (p > 0) inner += '<circle class="ring-elapsed" cx="60" cy="60" r="' + R + '" stroke-dasharray="' + (C * p).toFixed(2) + ' ' + C.toFixed(2) + '" transform="rotate(-90 60 60)"/>';
  // focus sessions, drawn where they happened
  for (const s of sessionsOn(months, today)) {
    if (!s.at) continue;
    const end = new Date(s.at), eMin = end.getHours() * 60 + end.getMinutes(), sMin = eMin - s.min;
    const a = Math.max(0, (sMin - startMin) / span), b = Math.min(1, (eMin - startMin) / span);
    if (b <= a) continue;
    inner += '<circle class="ring-focus" cx="60" cy="60" r="' + R + '" stroke-dasharray="' + (C * (b - a)).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-C * a).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
  }
  if (p > 0 && p < 1) {
    const a = p * 2 * Math.PI - Math.PI / 2;
    inner += '<circle class="ring-now" cx="' + (60 + R * Math.cos(a)).toFixed(2) + '" cy="' + (60 + R * Math.sin(a)).toFixed(2) + '" r="4.2"/>';
  }
  svg.innerHTML = inner;
  return h('div', { class: 'ring', title: 'היום שלך: ' + pad2(S.dayStart) + ':00 עד ' + pad2(S.dayEnd) + ':00. צהוב = זמן מיקוד.' },
    svg, h('div', { class: 'ring-center' }, h('b', null, center), h('span', null, label)));
}

/* ----- Claude picks three things for today ----- */
Sheets.planDay = function () {
  if (!AI.available()) return;
  const today = todayStr(), now = new Date();
  const tasks = openTasks().sort(taskSort).slice(0, 60);
  if (!tasks.length) { toast('אין משימות פתוחות לתכנן'); return; }

  openSheet({

    onClose: function () { ctl.abort(); },
    render: function (body, api) {
      const out = h('div', { class: 'ai-out' }, h('p', { class: 'ai-wait' }, icon('spark'), 'Claude עובר על ' + tasks.length + ' המשימות הפתוחות שלך…'));

        return { id: t.id, title: t.title, due: t.due || null, priority: t.prio === 2 ? 'urgent' : t.prio === 1 ? 'important' : 'normal', minutes: t.est || null, area: a ? a.name : null };

        'אלה המשימות הפתוחות שלו (JSON; due הוא תאריך יעד או null):\n' + JSON.stringify(payload) + '\n\n' +
        'בחר עד שלוש משימות שהכי נכון לסיים היום, לפי דחיפות, תאריך יעד, וכמה זמן נשאר ביום. העדף משימות באיחור או להיום, ואל תבחר שלוש משימות ארוכות אם השעה מאוחרת.\n' +
        'החזר רק JSON בצורה הזאת, בלי טקסט נוסף: {"picks":[{"id":"מזהה מהרשימה","why":"משפט קצר אחד בעברית"}],"tip":"עצה מעשית אחת בעברית, עד 20 מילים"}';
      Promise.resolve().then(function () { return AI.fn.json(prompt, { signal: ctl.signal }); }).then(function (res) {
        const picks = (res && Array.isArray(res.picks) ? res.picks : []).map(function (p) { return { t: Store.get('tasks', String(p && p.id)), why: String((p && p.why) || '') }; })

        picks.forEach(function (p, i) {

        put(api.foot, btn('לא עכשיו', { onclick: function () { api.close(); } }),

  put(root, h('div', { class: 'toolbar' }, bar1, h('div', { class: 'toolbar-end' }, areaSel, search)));

  const listHost = h('div', { class: 'groups' });

    clear(listHost);
    const q = UIState.tasksQuery.trim().toLowerCase();

    if (UIState.tasksFilter === 'today') list = list.filter(function (t) { return t.due && t.due <= today; });
    if (UIState.tasksFilter === 'week') list = list.filter(function (t) { return t.due && t.due <= weekEnd; });
    if (UIState.tasksFilter === 'nodate') list = list.filter(function (t) { return !t.due; });

        put(g, l); put(listHost, g);
      });
      if (list.length > shown.length) put(listHost, h('p', { class: 'sec-note' }, 'מוצגות 150 המשימות האחרונות מתוך ' + list.length + '.'));

    const groups = S.areas.map(function (a) { return { area: a, items: [] }; });
    const none = { area: null, items: [] };
    list.forEach(function (t) { const g = groups.find(function (x) { return x.area.id === t.area; }); (g || none).items.push(t); });

      const l = h('div', { class: 'task-list' });
      g.items.forEach(function (t) { put(l, taskRow(t, { hideArea: true, trailing: function (x) { return iconBtn('calendar', 'קבע יום', function () { Sheets.moveTask(x.id); }, 'sm'); } })); });
      put(sec, l); put(listHost, sec);
    });
  }
  paintList();
}

/* ================= WEEK ================= */

function weekRangeLabel(ws) {
  const a = parseYMD(ws), b = parseYMD(addDays(ws, 6));
  if (a.getMonth() === b.getMonth()) return a.getDate() + '–' + b.getDate() + ' ב' + MONTHS_HE[a.getMonth()];
  return a.getDate() + ' ב' + MONTHS_HE[a.getMonth()] + ' – ' + b.getDate() + ' ב' + MONTHS_HE[b.getMonth()];
}
function weekStats(ws) {
  const we = addDays(ws, 6), today = todayStr(), months = Store.map('months');
  const all = Store.all('tasks');
  const done = all.filter(function (t) { const d = t.done ? isoToYmd(t.doneAt) : null; return d && d >= ws && d <= we; });
  const openIn = all.filter(function (t) { return !t.done && t.due && t.due >= ws && t.due <= we; });
  let sched = 0, hd = 0;
  const perHabit = [];
  activeHabits().forEach(function (x) {
    let s = 0, d = 0;
    if (x.perWeek) { s = x.perWeek; d = Math.min(x.perWeek, habitWeekCount(x, months, ws)); }
    else for (let i = 0; i < 7; i++) {
      const day = addDays(ws, i);
      if (day > today) break;
      if (x.createdAt && day < isoToYmd(x.createdAt)) continue;
      if (!habitScheduled(x, day)) continue;
      s++; if (habitDone(months, x.id, day)) d++;
    }
    sched += s; hd += d;
    perHabit.push({ habit: x, sched: s, done: d });
  });
  const wins = [];
  for (let i = 0; i < 7; i++) { const day = addDays(ws, i), w = dayData(months, day).win; if (w) wins.push({ date: day, text: w }); }
  return { done: done, openIn: openIn, focusMin: focusMinRange(months, ws, we), habitPct: sched ? Math.round(100 * hd / sched) : null, perHabit: perHabit, wins: wins };
}

function renderWeek(root) {
  const today = todayStr(), months = Store.map('months');
  const ws = UIState.weekStart || weekStart(today), we = addDays(ws, 6);
  const isThisWeek = ws === weekStart(today);
  if (!UIState.weekDay || UIState.weekDay < ws || UIState.weekDay > we) UIState.weekDay = isThisWeek ? today : ws;
  const st = weekStats(ws);

  put(root, pageHead('שבוע', weekRangeLabel(ws) + (isThisWeek ? ' · השבוע' : ''),
    [iconBtn('right', 'השבוע הקודם', function () { UIState.weekStart = addDays(ws, -7); UIState.weekDay = null; App.renderNow(); }),
      !isThisWeek ? btn('השבוע', { small: true, onclick: function () { UIState.weekStart = null; UIState.weekDay = null; App.renderNow(); } }) : null,
      iconBtn('left', 'השבוע הבא', function () { UIState.weekStart = addDays(ws, 7); UIState.weekDay = null; App.renderNow(); }),
      h('a', { class: 'btn ghost', href: '#review', onclick: function () { UIState.reviewWeek = ws; } }, icon('review'), h('span', null, 'סקירה שבועית'))]));

  put(root, h('div', { class: 'stats wide' },
    statTile(String(st.openIn.length), 'מתוכננות'),
    statTile(String(st.done.length), 'בוצעו'),
    focusTile(st.focusMin, 'מיקוד'),
    statTile(st.habitPct == null ? '–' : st.habitPct + '%', 'הרגלים')));

  const all = Store.all('tasks');
  const courseItems = [];
  activeCourses().forEach(function (c) { (c.items || []).forEach(function (it) { if (it.due && it.due >= ws && it.due <= we) courseItems.push({ c: c, it: it }); }); });

  // day strip (phones)
  const strip = h('div', { class: 'day-strip', role: 'tablist', 'aria-label': 'ימי השבוע' });

    const hab = habitsFor(d).filter(function (x) { return !x.perWeek; });
    const habDone = hab.filter(function (x) { return habitDone(months, x.id, d); }).length;
    put(strip, h('button', {
      type: 'button', role: 'tab', 'aria-selected': UIState.weekDay === d ? 'true' : 'false',
      class: 'day-tab' + (UIState.weekDay === d ? ' on' : '') + (d === today ? ' today' : '') + (i >= 5 ? ' weekend' : ''),
      onclick: function () { UIState.weekDay = d; App.renderNow(); }
    }, h('b', null, DOW_SHORT[i]), h('span', null, String(parseYMD(d).getDate())), openCount ? h('i', { class: 'pip' }, String(openCount)) : null));

    const col = h('section', { class: 'day-col' + (d === today ? ' today' : '') + (UIState.weekDay === d ? ' sel' : '') + (i >= 5 ? ' weekend' : '') + (d < today ? ' past' : ''), dataset: { date: d }, 'aria-label': fmtDateLong(d) });
    put(col, h('header', { class: 'day-head' },
      h('div', null, h('b', null, 'יום ' + DOW_LONG[i]), h('span', null, fmtDayMonth(d))),
      hab.length && d <= today ? h('span', { class: 'chip', title: 'הרגלים שבוצעו' }, icon('habits'), habDone + '/' + hab.length) : null,
      iconBtn('plus', 'משימה ליום ' + DOW_LONG[i], function () { Sheets.quickAdd({ due: d }); }, 'sm')));
    const l = h('div', { class: 'task-list' });
    courseItems.filter(function (x) { return x.it.due === d; }).forEach(function (x) {
      put(l, h('button', { type: 'button', class: 'deadline' + (x.it.done ? ' done' : ''), style: { '--h': String(x.c.hue == null ? 186 : x.c.hue) }, onclick: function () { Sheets.course(x.c.id); } },
        icon('study'), h('span', null, h('b', null, x.it.t), h('small', null, (x.it.type || 'מטלה') + ' · ' + x.c.name))));
    });
    dayTasks.forEach(function (t) {
      put(l, taskRow(t, { hideDue: true, brief: true, draggable: true, trailing: function (x) { return iconBtn('calendar', 'העבר ליום אחר', function () { Sheets.moveTask(x.id); }, 'sm move'); } }));
    });
    if (!l.childNodes.length) put(l, h('p', { class: 'day-empty' }, d < today ? 'לא נרשם כלום' : 'פנוי'));
    put(col, l);
    col.addEventListener('dragover', function (e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; col.classList.add('drop'); });
    col.addEventListener('dragleave', function (e) { if (!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
    col.addEventListener('drop', function (e) {
      e.preventDefault(); col.classList.remove('drop');
      const id = e.dataTransfer.getData('text/plain');
      if (id && Store.get('tasks', id)) Actions.updateTask(id, { due: d });
    });
    put(board, col);
  }
  put(root, strip, board);

  // what still needs a day
  const late = isThisWeek ? all.filter(function (t) { return !t.done && t.due && t.due < ws; }).sort(taskSort) : [];
  const nodate = all.filter(function (t) { return !t.done && !t.due && t.src !== 'jobs'; }).sort(taskSort);
  if (late.length || nodate.length) {
    const sec = h('section', { class: 'card backlog' });
    put(sec, sectionHead('ממתינות לשיבוץ', h('span', { class: 'sec-aside desk-only' }, 'אפשר לגרור משימה אל יום בלוח'), late.length + nodate.length));
    if (late.length) {
      put(sec, h('div', { class: 'sub-head late' }, h('span', null, icon('alert'), 'נשארו משבועות קודמים (' + late.length + ')')));
      const l = h('div', { class: 'task-list' });
      late.forEach(function (t) { put(l, taskRow(t, { draggable: true, trailing: function (x) { return iconBtn('calendar', 'קבע יום', function () { Sheets.moveTask(x.id); }, 'sm'); } })); });
      put(sec, l);
    }
    if (nodate.length) {
      if (late.length) put(sec, h('div', { class: 'sub-head' }, h('span', null, 'בלי תאריך (' + nodate.length + ')')));
      const l = h('div', { class: 'task-list' });

      put(sec, l);
      if (nodate.length > 40) put(sec, h('p', { class: 'sec-note' }, 'ועוד ' + (nodate.length - 40) + ' ברשימת המשימות.'));
    }
    put(root, sec);
  }
}

const ITEM_TYPES = ['מטלה', 'מבחן', 'בוחן', 'פרויקט', 'קריאה', 'הרצאה'];

function courseStudyMin(courseId, from, to) {
  const months = Store.map('months');
  let sum = 0;
  months.forEach(function (m, ym) {
    const days = m.d || {};
    for (const dd of Object.keys(days)) {
      const date = ym + '-' + dd;
      if ((from && date < from) || (to && date > to)) continue;
      const s = days[dd].s || {};
      for (const k of Object.keys(s)) if (s[k] && s[k].courseId === courseId) sum += Number(s[k].min) || 0;
    }
  });
  return sum;
}

/* ================= NOTES + WINS ================= */

function allWins() {
  const out = [];
  Store.map('months').forEach(function (m, ym) {
    const days = m.d || {};
    for (const dd of Object.keys(days)) if (days[dd] && days[dd].win) out.push({ date: ym + '-' + dd, text: days[dd].win });
  });
  Store.all('goals').forEach(function (g) { if (g.status === 'done' && g.doneAt) out.push({ date: isoToYmd(g.doneAt), text: 'השגתי יעד: ' + g.title, goal: true }); });
  return out.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
}

function renderNotes(root) {
  const today = todayStr();
  const notes = Store.all('notes').sort(function (a, b) {
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;

  });
  put(root, pageHead('פתקים', 'מקום לזרוק אליו כל מה שעולה בראש, ויומן של מה שהלך טוב',

  const search = h('input', { type: 'search', id: 'nt-search', class: 'search', placeholder: 'חיפוש בפתקים', value: UIState.notesQuery, 'aria-label': 'חיפוש בפתקים', oninput: function () { UIState.notesQuery = search.value; paint(); } });
  const grid = h('div', { class: 'note-grid' });

    clear(grid);
    const q = UIState.notesQuery.trim().toLowerCase();

    list.forEach(function (n) {

    toast((await copyText(text)) ? 'ההישגים הועתקו' : 'ההעתקה לא הצליחה');
  } }) : null, wins.length || null));
  put(sec, h('p', { class: 'sec-note' }, 'כל "הישג היום" שאתה רושם נאסף כאן. שימושי לפני ראיון עבודה, שיחת משוב או עדכון קורות חיים.'));
  if (!wins.length) put(sec, emptyState('עוד לא נרשמו הישגים', 'רשום הישג אחד ביומן היום, בסוף כל יום. גם קטן.', h('a', { class: 'btn ghost sm', href: '#today' }, 'ליומן היום')));
  else {
    let lastYm = '';

    wins.slice(0, 120).forEach(function (w) {
      const ym = ymOf(w.date);
      if (ym !== lastYm) { lastYm = ym; put(ul, h('li', { class: 'win-month' }, MONTHS_HE[parseYMD(w.date).getMonth()] + ' ' + parseYMD(w.date).getFullYear())); }

/* ================= WEEKLY REVIEW ================= */

function renderReview(root) {
  const today = todayStr();
  const ws = UIState.reviewWeek || weekStart(today), we = addDays(ws, 6);
  const isThisWeek = ws === weekStart(today);
  const st = weekStats(ws);
  const saved = Store.get('weeks', ws) || {};

  put(root, pageHead('סקירה שבועית', weekRangeLabel(ws) + (isThisWeek ? ' · השבוע' : ''),
    [iconBtn('right', 'השבוע הקודם', function () { UIState.reviewWeek = addDays(ws, -7); App.renderNow(); }),
      !isThisWeek ? btn('השבוע', { small: true, onclick: function () { UIState.reviewWeek = null; App.renderNow(); } }) : null,
      ws < weekStart(today) ? iconBtn('left', 'השבוע הבא', function () { UIState.reviewWeek = addDays(ws, 7); App.renderNow(); }) : null]));

  put(root, h('div', { class: 'stats wide' },
    statTile(String(st.done.length), 'משימות בוצעו'),
    statTile(String(st.openIn.length), 'נשארו פתוחות'),
    focusTile(st.focusMin, 'מיקוד'),
    statTile(st.habitPct == null ? '–' : st.habitPct + '%', 'הרגלים')));

  const colA = h('div', { class: 'col' }), colB = h('div', { class: 'col' });

  // facts
  const facts = h('section', { class: 'card' });
  put(facts, sectionHead('מה קרה השבוע'));
  if (st.done.length) {
    const det = h('details', { open: st.done.length <= 6 }, h('summary', null, st.done.length + ' משימות שבוצעו'));
    const ul = h('ul', { class: 'plain-list' });
    st.done.sort(function (a, b) { return (a.doneAt || '') < (b.doneAt || '') ? -1 : 1; }).forEach(function (t) { put(ul, h('li', null, icon('check'), h('span', null, t.title), areaChip(t.area))); });
    put(det, ul); put(facts, det);
  } else put(facts, h('p', { class: 'sec-note' }, 'לא סומנו משימות כבוצעו בשבוע הזה.'));

    const tbl = h('div', { class: 'habit-table' });

      const pct = p.sched ? Math.round(100 * p.done / p.sched) : 0;
      put(tbl, h('div', { class: 'ht-row', style: { '--h': String(p.habit.hue == null ? 226 : p.habit.hue) } }, h('span', null, p.habit.name), bar(pct, 'hue'), h('b', null, p.done + '/' + p.sched)));
    });
    put(facts, h('h3', { class: 'mini-h' }, 'הרגלים'), tbl);
  }
  if (st.wins.length) {
    const ul = h('ul', { class: 'plain-list' });
    st.wins.forEach(function (w) { put(ul, h('li', null, icon('trophy'), h('span', null, w.text), h('small', null, 'יום ' + DOW_SHORT[dowOf(w.date)]))); });
    put(facts, h('h3', { class: 'mini-h' }, 'הישגים שרשמת'), ul);
  }
  put(colA, facts);

  // Claude's read of the week
  if (AI.available()) {
    const aiCard = h('section', { class: 'card ai-card' });
    const out = h('div', { class: 'ai-text', id: 'rv-ai' });
    let ctl = null;
    const go = btn('תובנות על השבוע', { icon: 'spark', cls: 'ai', onclick: async function () {
      if (ctl) { ctl.abort(); return; }
      ctl = new AbortController();
      go.querySelector('span').textContent = 'עצור';
      out.textContent = 'Claude קורא את השבוע שלך…';
      const facts = {
        week: ws + ' עד ' + we,
        tasksDone: st.done.map(function (t) { const a = areaById(t.area); return t.title + (a ? ' [' + a.name + ']' : ''); }).slice(0, 60),
        tasksStillOpen: st.openIn.map(function (t) { return t.title + ' (יעד ' + t.due + ')'; }).slice(0, 40),
        focusMinutes: st.focusMin,
        habits: st.perHabit.map(function (p) { return p.habit.name + ': ' + p.done + '/' + p.sched; }),
        wins: st.wins.map(function (w) { return w.text; }),
        myNotes: { good: good.value.trim(), bad: bad.value.trim(), learn: learn.value.trim() }
      };
      try {
        const res = await AI.fn(
          'אתה מאמן אישי ישיר וענייני. לפניך נתוני השבוע של אדם אחד (JSON):\n' + JSON.stringify(facts) + '\n\n' +
          'כתוב בעברית, בגוף שני, בלי כותרות ובלי רשימות ארוכות: (1) שתי תצפיות קונקרטיות על מה שהנתונים מראים, (2) דבר אחד שכדאי לשנות בשבוע הבא, (3) שאלה אחת ששווה לו לחשוב עליה. עד 120 מילים בסך הכול. אל תמציא עובדות שלא מופיעות בנתונים, ואם יש מעט נתונים אמור זאת.',
          { signal: ctl.signal, cache: false, onText: function (u) { out.textContent = u.text; } });
        out.textContent = res.text;
      } catch (e) {
        const m = AI.explain(e);
        if (m) out.textContent = (e && e.text ? e.text + '\n\n' : '') + m;
        if (!AI.available()) aiCard.remove();
      }
      ctl = null;
      const sp = go.querySelector('span'); if (sp) sp.textContent = 'תובנות על השבוע';
    } });
    put(aiCard, sectionHead('מבט מבחוץ', go), h('p', { class: 'sec-note' }, 'Claude יקרא את נתוני השבוע ויחזיר כמה משפטים. הבקשה נספרת בשימוש שלך ב-Claude.'), out);
    put(colA, aiCard);

  const bad = h('textarea', { id: 'rv-bad', rows: '3', placeholder: 'מה נתקע? ממה התחמקת?' }); bad.value = saved.bad || '';
  const learn = h('textarea', { id: 'rv-learn', rows: '2', placeholder: 'דבר אחד שלמדת על עצמך או על העבודה' }); learn.value = saved.learn || '';

  const collect = function () {
    return { wk: ws, good: good.value.trim(), bad: bad.value.trim(), learn: learn.value.trim(), next: nextInputs.map(function (i) { return i.value.trim(); }), score: score || null, doneAt: nowIso(), nextAdded: !!saved.nextAdded };
  };
  put(form, 
    field('מה הלך טוב', good), field('מה לא עבד', bad), field('מה למדתי', learn),
    h('div', { class: 'field' }, h('span', { class: 'label' }, 'שלוש עדיפויות לשבוע הבא'), h('div', { class: 'stack' }, nextInputs)),
    h('div', { class: 'field' }, h('span', { class: 'label' }, 'ציון לשבוע'), scorePick),
    h('div', { class: 'row wrap between' },
      btn(saved.nextAdded ? 'העדיפויות כבר נוספו כמשימות' : 'שמור והוסף אותן כמשימות ליום א׳', { disabled: !!saved.nextAdded, icon: 'tasks', onclick: function () {
        const data = collect(), sunday = addDays(ws, 7);
        const items = data.next.filter(Boolean);
        if (!items.length) { nextInputs[0].focus(); toast('כתוב לפחות עדיפות אחת'); return; }
        items.forEach(function (t) { Actions.addTask({ title: t, due: sunday, prio: 1 }); });
        data.nextAdded = true;
        Store.save('weeks', ws, data);
        toast(items.length + ' משימות נוספו ליום ראשון, ' + fmtDayMonth(sunday));
        App.renderNow();
      } }),
      btn('שמור סקירה', { kind: 'primary', onclick: function () { Store.save('weeks', ws, collect()); toast('הסקירה נשמרה'); App.renderNow(); } })));
  put(colB, form);

  // history
  const past = Store.all('weeks').filter(function (w) { return w.id !== ws; }).sort(function (a, b) { return a.id < b.id ? 1 : -1; });

/* ---------- reading a pasted report ---------- */

/** Without Claude: every [text](link) in the report becomes a posting, with what its paragraph says. */
function parseJobsPlain(text) {
  const out = [], seen = new Set();
  const paras = String(text || '').replace(/\r/g, '').split(/\n\s*\n|\n(?=\s*(?:\d+[.)]|[-•*])\s)/);
  for (const p of paras) {
    const re = /\[([^\]\n]{2,200})\]\((https?:\/\/[^)\s]+)\)/g;
    let m;
    while ((m = re.exec(p))) {
      const url = safeUrl(m[2]);
      if (!url || seen.has(url)) continue;
      seen.add(url);
      const name = m[1].replace(/[*_`]/g, '').trim();
      const parts = name.split(/\s+[–—\-·|]\s+|\s+@\s+|\s+at\s+/);
      const plain = p.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*_`#>]/g, '').replace(/\s+/g, ' ').trim();
      const cv = (p.match(/\bCV[_-][A-Za-z0-9_\-]+/) || [])[0] || ((p.match(/קורות חיים:\s*([^\n]{2,60})/) || [])[1] || '').trim();
      const match = /התאמה[^.\n]{0,12}גבוהה|גבוהה/.test(p) ? 'high' : /בינונית/.test(p) ? 'medium' : /שווה ניסיון/.test(p) ? 'try' : '';
      out.push({ role: parts[0] || name, company: parts.length > 1 ? parts.slice(1).join(' · ') : '', url: url, match: match, cv: cv, place: '', notes: plain.slice(0, 400) });
      if (out.length >= 20) return out;
    }
  }
  return out;
}

async function parseJobsWithClaude(text, signal) {
  const res = await AI.fn.json(
    'לפניך דוח משרות בעברית שכתב סוכן חיפוש עבודה. חלץ ממנו את המשרות.\n' +
    'החזר רק מערך JSON, בלי טקסט נוסף. לכל משרה אובייקט: {"role":"שם התפקיד","company":"החברה","url":"הקישור למודעה בדיוק כפי שהוא מופיע בטקסט, או null","match":"high|medium|try|null","cv":"שם קובץ קורות החיים שהומלץ, או null","place":"מיקום וזמן הגעה, קצר, או null","notes":"שורה או שתיים: למה מתאים ומה חסר"}.\n' +
    'match: high להתאמה גבוהה, medium לבינונית, try ל"שווה ניסיון". אל תמציא שום פרט שלא כתוב בדוח. דלג על שורות שאינן משרה.\n\nהדוח:\n"""\n' +
    String(text).slice(0, 40000) + '\n"""',
    { modelTier: 'quick', signal: signal });
  const arr = Array.isArray(res) ? res : (res && Array.isArray(res.jobs) ? res.jobs : []);
  return arr.map(function (j) {
    j = j || {};
    const str = function (v, n) { return v == null ? '' : String(v).trim().slice(0, n); };
    return { role: str(j.role, 140), company: str(j.company, 100), url: safeUrl(j.url), match: MATCH_LABEL[j.match] ? j.match : '', cv: str(j.cv, 80), place: str(j.place, 140), notes: str(j.notes, 500) };
  }).filter(function (j) { return j.role || j.company; }).slice(0, 20);
}

Sheets.importJobs = function () {
  const known = new Set(Store.all('tasks').map(function (t) { return safeUrl(t.url); }).filter(Boolean));
  let ctl = null, found = [];
  openSheet({
    title: 'משרות מהדוח',
    onClose: function () { if (ctl) ctl.abort(); },
    render: function (body, api) {
      const text = h('textarea', { id: 'ij-text', rows: '8', placeholder: 'הדבק כאן את הדוח של סוכן המשרות, כמו שהוא' });
      const status = h('p', { class: 'hint', 'aria-live': 'polite' });
      const preview = h('div', { class: 'ij-list' });
      const addBtn = btn('הוסף', { kind: 'primary', disabled: true, onclick: function () { addChosen(); } });
      const paint = function () {
        clear(preview);
        found.forEach(function (j) {
          const dup = j.url && known.has(j.url);
          if (j.keep == null) j.keep = !dup;
          const row = h('label', { class: 'ij-row' + (dup ? ' dup' : '') },
            h('input', { type: 'checkbox', checked: j.keep, onchange: function (e) { j.keep = e.target.checked; count(); } }),
            h('span', { class: 'ij-main' },
              h('b', null, j.role + (j.company ? ' · ' + j.company : '')),
              h('small', null, [MATCH_LABEL[j.match], j.place, j.cv, dup ? 'כבר קיימת אצלך' : (j.url ? '' : 'בלי קישור')].filter(Boolean).join(' · '))));
          put(preview, row);
        });
        count();
      };
      const count = function () {
        const n = found.filter(function (j) { return j.keep; }).length;
        addBtn.disabled = !n;
        addBtn.querySelector('span').textContent = n ? 'הוסף ' + n + (n === 1 ? ' משרה' : ' משרות') : 'הוסף';
      };
      const run = async function () {
        const v = text.value.trim();
        if (!v) { text.focus(); return; }
        found = []; paint();
        if (AI.available()) {
          ctl = new AbortController();
          readBtn.disabled = true;
          status.textContent = 'Claude קורא את הדוח…';
          try { found = await parseJobsWithClaude(v, ctl.signal); }
          catch (e) {
            const m = AI.explain(e);
            if (e && e.code === 'cancelled') { readBtn.disabled = false; return; }
            found = parseJobsPlain(v);
            status.textContent = (m ? m + ' ' : '') + 'קראתי את הקישורים בלי Claude.';
          }
          ctl = null; readBtn.disabled = false;
        } else found = parseJobsPlain(v);
        if (!found.length) { status.textContent = 'לא מצאתי משרות בטקסט. ודא שהדבקת את הדוח כולו, כולל הקישורים.'; return; }
        const dups = found.filter(function (j) { return j.url && known.has(j.url); }).length;
        status.textContent = 'נמצאו ' + found.length + ' משרות' + (dups ? ', ' + dups + ' מהן כבר קיימות אצלך' : '') + '. סמן מה להוסיף.';
        paint();
      };
      const addChosen = function () {
        const chosen = found.filter(function (j) { return j.keep; });
        const now = Date.now();
        chosen.forEach(function (j, i) {
          Actions.addTask({
            title: 'להגיש: ' + j.role + (j.company ? ' · ' + j.company : ''), role: j.role, company: j.company, url: j.url || null,
            match: j.match || null, cv: j.cv || null, place: j.place || null, notes: j.notes || '',
            area: 'jobs', due: null, prio: j.match === 'high' ? 1 : 0, est: 30, src: 'jobs',
            createdAt: new Date(now - i).toISOString()
          });
        });
        api.close();
        toast('נוספו ' + chosen.length + (chosen.length === 1 ? ' משרה' : ' משרות') + ' למסך היום');
      };
      const readBtn = btn('קרא את הדוח', { icon: AI.available() ? 'spark' : 'briefcase', cls: AI.available() ? 'ai' : '', onclick: run });
      put(body, field('הדוח', text, AI.available() ? 'Claude יחלץ את המשרות, הקישורים וגרסת קורות החיים. הבקשה נספרת בשימוש שלך.' : 'כל קישור למודעה בדוח יהפוך למשרה.'),
        h('div', { class: 'row wrap' }, readBtn), status, preview);
      put(api.foot, h('span'), h('div', { class: 'row' }, btn('ביטול', { onclick: function () { api.close(); } }), addBtn));
      text.setAttribute('autofocus', '');
    }
  });
};

const BACKUP_KEY = 'lifeos:lastBackup';
const FIRST_USE_KEY = 'lifeos:firstUse';
function markBackedUp() { Store.ls.set(BACKUP_KEY, new Date().toISOString()); Store.notify(); }
function daysSinceBackup() {
  const last = Store.ls.get(BACKUP_KEY) || Store.ls.get(FIRST_USE_KEY);
  return last ? diffDays(isoToYmd(last), todayStr()) : 0;
}
/** Outside Claude: a real file. On a phone the share sheet (save to Drive, Files, WhatsApp), elsewhere a download. */
async function saveBackupFile(json) {
  const name = 'life-center-' + todayStr() + '.json';
  try {
    const file = new File([json], name, { type: 'application/json' });
    const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'גיבוי מרכז שליטה' });
      return true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return false;
  }
  try {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = h('a', { href: url, download: name, style: { display: 'none' } });
    document.body.append(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return true;
  } catch (e) { return false; }
}
async function exportBackup() {
  const json = JSON.stringify(Store.exportAll(), null, 1);
  if (STANDALONE) {
    if (await saveBackupFile(json)) { markBackedUp(); toast('קובץ הגיבוי נשמר'); }
    return;
  }
  try {
    const cl = window.claude;
    const d = cl && typeof cl.use === 'function' ? await cl.use('downloads') : null;
    if (d) {
      await d.save({ filename: 'life-center-' + todayStr() + '.json', data: json });
      markBackedUp();
      toast('קובץ הגיבוי נשמר');
      return;
    }
  } catch (e) {
    if (e && e.code === 'declined') return;
  }
  toast((await copyText(json)) ? 'הורדה לא זמינה כאן, אז הגיבוי הועתק. הדבק אותו בקובץ טקסט ושמור.' : 'לא הצלחתי לייצא מכאן. נסה מהדף המלא.', { ms: 7000 });
}

/* ================= page frame ================= */

function currentRoute() {
  const r = (location.hash || '').replace(/^#/, '');
  return Object.prototype.hasOwnProperty.call(VIEWS, r) ? r : 'today';
}
function syncState() {
  const st = Store.status;
  if (!st.loaded) return { cls: 'wait', text: 'טוען…' };
  if (st.failed) return { cls: 'bad', text: 'לא נשמר' };
  if (st.saving) return { cls: 'busy', text: 'שומר…' };
  if (st.mode === 'local') return STANDALONE ? { cls: 'ok', text: 'נשמר במכשיר' } : { cls: 'local', text: 'בדפדפן הזה בלבד' };
  if (st.stale) return { cls: 'warn', text: 'אין חיבור' };
  return { cls: 'ok', text: 'נשמר' };
}

/* ---------- keep what the person is typing across a redraw ---------- */
let lastInputAt = 0, restoring = false;
document.addEventListener('input', function (e) {
  if (restoring) return;
  const el = e.target;
  if (el && el.closest && el.closest('#view')) { lastInputAt = Date.now(); if (el.id && el.dataset) el.dataset.dirty = '1'; }
}, true);

function snapshotView(view) {
  const snap = { vals: {}, active: null, open: {} };
  view.querySelectorAll('input[id], textarea[id]').forEach(function (el) {
    if (el.dataset.dirty && el.type !== 'checkbox' && el.type !== 'file') snap.vals[el.id] = el.value;
  });
  view.querySelectorAll('details[data-k]').forEach(function (d) { snap.open[d.dataset.k] = d.open; });
  const a = document.activeElement;
  if (a && a.id && view.contains(a)) {
    snap.active = { id: a.id };
    try { snap.active.s = a.selectionStart; snap.active.e = a.selectionEnd; } catch (e) { /* not a text field */ }
  }
  return snap;
}
function restoreView(view, snap) {
  restoring = true;
  for (const id of Object.keys(snap.vals)) {
    const el = document.getElementById(id);
    if (!el || !view.contains(el) || el.value === snap.vals[id]) continue;
    el.value = snap.vals[id];
    el.dataset.dirty = '1';
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
  view.querySelectorAll('details[data-k]').forEach(function (d) { if (d.dataset.k in snap.open) d.open = snap.open[d.dataset.k]; });
  restoring = false;
  if (snap.active) {
    const el = document.getElementById(snap.active.id);
    if (el && view.contains(el) && !sheetOpen()) {
      try { el.focus({ preventScroll: true }); if (snap.active.s != null && el.setSelectionRange) el.setSelectionRange(snap.active.s, snap.active.e); } catch (e) { /* ignore */ }
    }
  }
}

let lastRoute = null;
function render(fresh) {
  const route = currentRoute();
  renderChrome(route);
  const view = document.getElementById('view');
  if (!Store.status.loaded) {
    put(clear(view), h('div', { class: 'loading' }, h('div', { class: 'sk hero-sk' }), h('div', { class: 'sk' }), h('div', { class: 'sk' }), h('p', null, 'טוען את הנתונים שלך…')));
    return;
  }
  const same = lastRoute === route && !fresh;
  const snap = same ? snapshotView(view) : null;
  const scroll = same ? view.scrollTop : 0;
  const root = h('div', { class: 'view-in v-' + route });
  try { VIEWS[route].render(root); }
  catch (e) {
    console.error(e);
    put(clear(root), h('div', { class: 'card' }, emptyState('משהו השתבש בהצגת המסך', String(e && e.message || e), btn('נסה שוב', { onclick: function () { render(true); } }))));
  }
  put(clear(view), root);
  view.scrollTop = scroll;
  if (snap) restoreView(view, snap);
  lastRoute = route;
  Timer.paint();
}

let deferTimer = null;
function typingInView() {
  const a = document.activeElement;
  if (!a || !a.closest || !a.closest('#view')) return false;
  if (a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA') return false;
  if (a.type === 'checkbox' || a.type === 'date' || a.type === 'file') return false;
  return Date.now() - lastInputAt < 1500;
}
function onStoreChange() {
  clearTimeout(deferTimer);
  if (typingInView()) { deferTimer = setTimeout(onStoreChange, 500); return; }
  render();
}

const App = {
  /** Redraw right away. fresh=true drops unsaved text in the screen (used when the screen now shows something else). */
  renderNow: function (fresh) { clearTimeout(deferTimer); lastInputAt = 0; render(!!fresh); }
};

/* ================= start-up ================= */

let lastDay = todayStr();
function everyMinute() {
  const t = todayStr();
  if (t !== lastDay) { lastDay = t; if (!sheetOpen()) render(true); return; }
  if (currentRoute() === 'today' && Store.status.loaded) {
    const ring = document.querySelector('#view .ring');
    if (ring) ring.replaceWith(dayRing(settings(), t, new Date()));
  }
}

document.addEventListener('keydown', function (e) {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || sheetOpen()) return;
  const a = document.activeElement, tag = a && a.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (a && a.isContentEditable)) return;
  if (e.key === 'n' || e.key === 'N' || e.key === 'מ') { e.preventDefault(); Sheets.quickAdd(currentRoute() === 'today' ? { due: todayStr() } : {}); }
});

function standaloneSetup() {
  if (!STANDALONE) return;
  if (!Store.ls.get(FIRST_USE_KEY)) Store.ls.set(FIRST_USE_KEY, new Date().toISOString());
  // ask the browser not to clear this site's storage when space runs low
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) { /* ignore */ }
  if ('serviceWorker' in navigator && /^https:$|^http:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('offline mode unavailable', e); }); });
  }
}
async function boot() {
  standaloneSetup();
  document.getElementById('fab').addEventListener('click', function () { Sheets.quickAdd(currentRoute() === 'today' ? { due: todayStr() } : {}); });
  render();
  Store.on(onStoreChange);
  window.addEventListener('hashchange', function () { render(true); const v = document.getElementById('view'); v.scrollTop = 0; });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) everyMinute(); });
  try { await Store.init(); } catch (e) { console.error(e); Store.status.loaded = true; }
  Timer.boot();
  AI.init();
  render();
  setInterval(everyMinute, 30000);
}
boot();
